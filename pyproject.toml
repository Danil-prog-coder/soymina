[project]
name = "ivc-tasks"
version = "0.1.0"
description = "ИС управления задачами и формирования документов для Ярославского ИВЦ ОАО «РЖД»"
requires-python = ">=3.12"

[tool.tortoise]
tortoise_orm = "app.config.TORTOISE_ORM"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
